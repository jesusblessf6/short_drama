# AI 短剧工厂 — 全局配置
# 与具体项目无关，所有项目共用

# 运行模式（M1）：
#   demo       = 占位/降级全放行，零 key 可离线跑通（开发验证用，默认）
#   production = 启动校验配置齐全（key/provider/价格），禁止静默降级自动通过
mode: demo

# 三级预算（¥，M1）。提交付费生成任务前按单次预估检查，超出即阻止：
#   per_shot_cny    单镜头 t2i+i2v 累计上限（烧完 → 该镜头升级终态）
#   per_episode_cny 单集上限（超出 → 该集停止新付费任务，等预算调整）
#   project_cny     项目总上限（超出 → 全项目停止新付费任务）
# 只约束付费生成 API（t2i/i2v）；占位/本地 ffmpeg/edge-tts 不受影响。删掉某级即不限。
budget:
  per_shot_cny: 30.0
  per_episode_cny: 400.0
  project_cny: 2000.0

# 判断层（M2+，详见 references/Jev决策层引入评估.md）：
#   人审意图解析 / 升级处置 / 红线预检 三个决策点走类型化判断（Jev 式）。
#   provider: rule = 判断层弃权、行为与历史完全一致（默认，零 key）
#   provider: jev  = 激活判断层。mock=true 先用确定性模拟跑通管线；
#                    接 Jev 云改 mock: false + api_key；
#                    换本地开源判断模型（jevos 等，同一 wire 协议）只改 endpoint，
#                    如 endpoint: "http://127.0.0.1:8017"（本地端点无需 api_key）。
#   min_confidence: 置信度低于此值视同弃权，走既有路径（LLM 复核/人工），不静默放行。
#   redline_gate: off | log_only | block——block 需 provider=jev（正式模式校验强制）。
judgment:
  provider: rule
  endpoint: "https://api.typesafe.ai"
  api_key: "${JEV_API_KEY}"
  model: "jev-latest"
  mock: true
  timeout: 5.0
  min_confidence: 0.9
  redline_gate: log_only

llm:
  provider: volcengine
  base_url: "https://ark.cn-beijing.volces.com/api/coding/v3"
  api_key: "${ARK_CODING_API_KEY}"
  model: "glm-latest"
  vision_model: "glm-4v"
  max_tokens: 4096
  temperature: 0.7
  offline: false        # true 或 api_key 为空时，创意层走离线模板（零外部 key 可跑）
  price_per_1k_tokens: 0.002   # ¥/千token（混合估算），用于把 token 折算成钱

# 成本监测与偏离预警（基线为估算：成本占比用行业共识，token 占比用本项目架构估算）
cost_monitor:
  enabled: true
  deviation_threshold: 0.5     # 实际占比相对基线偏离超 ±50% 即预警
  baseline_cost_share:         # 各环节成本占比（行业共识：视频 >> 图 >> LLM）
    img2video: 0.77
    text2img: 0.19
    llm: 0.04
  baseline_token_share:        # LLM 各环节 token 占比（架构 §7 估算）
    storyboard: 0.41
    writer: 0.29
    visual_qa: 0.21
    director: 0.10

apis:
  text2img:
    provider: placeholder   # placeholder=本地占位图；接通后改 jimeng
    api_key: "${JIMENG_API_KEY}"
    model: "jimeng-3.0-pro"
    cost_per_call: 0.5
  img2video:
    provider: placeholder   # placeholder=ffmpeg 静帧转 mp4；接通后改 kling
    api_key: "${KLING_API_KEY}"
    model: "kling-2.1"
    cost_per_call: 2.0
  audio:
    provider: edge_tts
    voice: "zh-CN-XiaoxiaoNeural"       # 未映射角色的默认音色
    narrator_voice: "zh-CN-YunxiNeural" # 旁白音色（角色映射在 project.yaml production.voice_map）

orchestrator:
  parallel_episodes: 2
  parallel_shots: 3
  tick_interval: 10
  state_dir: ".state"

notify:
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  # hermes_api_url: "http://localhost:7777"

corpus:
  dir: "corpus"
  sources:
    - name: 聊斋志异
      url: "https://ctext.org/liaozhai-zhiyi"
    - name: 阅微草堂笔记
      url: "https://ctext.org/yuewei-caotang-biji"
    - name: 搜神记
      url: "https://ctext.org/soushenji"
    - name: 子不语
      url: "https://ctext.org/zibuyu"

ffmpeg:
  path: "ffmpeg"
  default_codec: "libx264"
  default_crf: 23
