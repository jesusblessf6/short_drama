# AI 短剧工厂 — 全局配置
# 与具体项目无关，所有项目共用

# 运行模式（M1）：
#   demo       = 占位/降级全放行，零 key 可离线跑通（开发验证用，默认）
#   production = 启动校验配置齐全（key/provider/价格），禁止静默降级自动通过
mode: demo

# 三级预算（¥，M1）。提交付费生成任务前按单次预估检查，超出即阻止：
#   per_shot_cny    单镜头 t2i+i2v 累计上限（烧完 → 该镜头升级终态）
#   per_episode_cny 单集上限（超出 → 该集停止新付费任务，等预算调整）
#   project_cny     项目总上限（超出 → 全项目停止新付费任务）
# 只约束付费生成 API（t2i/i2v）；占位/本地 ffmpeg/edge-tts 不受影响。删掉某级即不限。
budget:
  per_shot_cny: 30.0
  per_episode_cny: 400.0
  project_cny: 2000.0

# 判断层（M2+，详见 references/Jev决策层引入评估.md）：
#   人审意图解析 / 升级处置 / 红线预检 三个决策点走类型化判断（Jev 式）。
#   provider: rule = 判断层弃权、行为与历史完全一致（默认，零 key）
#   provider: jev  = 激活判断层。mock=true 先用确定性模拟跑通管线；
#                    接 Jev 云改 mock: false + api_key；
#                    换本地开源判断模型（jevos 等，同一 wire 协议）只改 endpoint，
#                    如 endpoint: "http://127.0.0.1:8017"（本地端点无需 api_key）。
#   min_confidence: 置信度低于此值视同弃权，走既有路径（LLM 复核/人工），不静默放行。
#   redline_gate: off | log_only | block——block 需 provider=jev（正式模式校验强制）。
judgment:
  provider: rule
  endpoint: "https://api.typesafe.ai"
  api_key: "${JEV_API_KEY}"
  model: "jev-latest"
  mock: true
  timeout: 5.0
  min_confidence: 0.9
  redline_gate: log_only

llm:
  # 创意层接火山方舟 Doubao Seed Pro 2.1（model id: doubao-seed-2.1-pro，本 key 实测可用；
  # 端点内部解析为 doubao-seed-2-1-pro-260915：点号是官方简称，短横线+日期为底层模型名，
  # 两者等价——写哪个都能调通，此处用官方简称）；
  # plan 端点 chat 可用，key 为 Agent Plan 专属 AGENT_API_KEY，与视觉生成同一账号）。
  # **extra_body.thinking.disabled 是关键**：Seed 2.1 默认深度思考，实测 reasoning
  # 1375 字符/9018 token/151s；关掉后 3 场景/4267 token/30s，产出含【镜头】运镜描述
  # 与「角色：台词」前缀（正好匹配 storyboard 的台词提取）。
  # 对照模型（同一 writer 负载）：MiniMax-M3 1650字符/3场景/11306token/51s（质量相当，
  # 成本约 2.6 倍）；M3.1-Flash-Preview 1446/2场/4325/18s（骨架级，无镜头描述）。
  # 切回 MiniMax：base_url https://api.minimax.cn/v1 + api_key ${MINIMAX_API_KEY}
  #   + model MiniMax-M3（删掉 extra_body.thinking）。切回标准方舟账号：base_url 换 /api/v3。
  provider: volcengine
  base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
  api_key: "${AGENT_API_KEY}"
  model: "doubao-seed-2.1-pro"
  vision_model: "doubao-seed-2.1-pro"   # Seed 系列多模态，画面质检同模型
  max_tokens: 8192
  temperature: 0.7
  extra_body:
    thinking:
      type: disabled            # 关闭深度思考：把 token 预算留给正文
  offline: false        # true 或 api_key 为空时，创意层走离线模板（零外部 key 可跑）
  price_per_1k_tokens: 0.01   # ¥/千token 折算估算（套餐内扣减；账单核对后校准）

# 成本监测与偏离预警（基线为估算：成本占比用行业共识，token 占比用本项目架构估算）
cost_monitor:
  enabled: true
  deviation_threshold: 0.5     # 实际占比相对基线偏离超 ±50% 即预警
  baseline_cost_share:         # 各环节成本占比（行业共识：视频 >> 图 >> LLM）
    img2video: 0.77
    text2img: 0.19
    llm: 0.04
  baseline_token_share:        # LLM 各环节 token 占比（架构 §7 估算）
    storyboard: 0.41
    writer: 0.29
    visual_qa: 0.21
    director: 0.10

apis:
  # 方舟 Agent Plan 企业版视觉模型（官方《接入视觉模型》文档，PDF 在 references/）：
  #   专属 base_url（必须带 /plan）+ 专属 API Key（AGENT_API_KEY，Coding Plan 的 key 不可用！）
  #   获取：https://ark.volcengine.com 控制台 → API Key 管理（agentEnterprise）
  # 离线/零成本跑通时把 provider 改回 placeholder 即可。
  text2img:
    provider: ark
    api_key: "${AGENT_API_KEY}"
    model: "doubao-seedream-5-0-pro"     # lite 即将下线，勿用
    base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
    extra:
      size: "1080x1920"                  # 竖屏 9:16（≤1.5K 档 ≈100 AFP/张）
    cost_per_call: 0.2                   # ¥ 折算估算（套餐内实扣 AFP；预算闸门用）
    # provider: placeholder              # ← 离线占位模式（零成本）切回这里
  img2video:
    # 暂切 MiniMax H3 备用线路（v2 协议）。切回方舟：provider→ark、api_key→${AGENT_API_KEY}、
    # base_url→https://ark.cn-beijing.volces.com/api/plan/v3、extra→{ratio: 9:16, generate_audio: false}
    provider: minimax
    api_key: "${MINIMAX_API_KEY}"
    model: "MiniMax-H3"                  # 极速版 MiniMax-H3-Max 仅 480P/768P 且 5-15s
    base_url: "https://api.minimax.cn"
    extra:
      resolution: "768P"                 # 必填枚举：480P/768P/2K；2K 仅 H3 支持
      ratio: "adaptive"                  # 图生视频恒按 adaptive（首帧即基准）
    cost_per_call: 1.0                   # ¥ 折算估算（按量计费，账单核对后校准）
  # 备用视频线路：MiniMax H3（seedance 故障/限流时手动切换，改上面 provider + api_key + base_url + extra 即可）
  # v2 协议已接（img2video._run_minimax）：POST /v2/video_generation + GET /v2/query/video_generation/{id}
  # key：platform.minimax.cn 账户管理 → 接口密钥（JWT）；计费按量（usage.total_seconds）
  minimax_fallback:                      # 非活动参考块：启用时把下面字段上移到 img2video 节
    provider: minimax
    api_key: "${MINIMAX_API_KEY}"
    model: "MiniMax-H3"                  # 极速版 MiniMax-H3-Max 仅 480P/768P 且 5-15s
    base_url: "https://api.minimax.cn"
    extra:
      resolution: "768P"                 # 必填枚举：480P/768P/2K；2K 仅 H3 支持
      ratio: "adaptive"                  # 图生视频恒按 adaptive（首帧即基准）
    cost_per_call: 1.0                   # ¥ 折算估算（按量计费，账单核对后校准）
    # provider: placeholder              # ← 离线占位模式（零成本）切回这里
  audio:
    provider: edge_tts
    voice: "zh-CN-XiaoxiaoNeural"       # 未映射角色的默认音色
    narrator_voice: "zh-CN-YunxiNeural" # 旁白音色（角色映射在 project.yaml production.voice_map）

orchestrator:
  parallel_episodes: 2
  parallel_shots: 3
  tick_interval: 10
  state_dir: ".state"

notify:
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
  # hermes_api_url: "http://localhost:7777"

